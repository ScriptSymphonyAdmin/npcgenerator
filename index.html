<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Middle Sea — OSE Generator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Cinzel+Decorative:wght@400;700&family=EB+Garamond:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
<style>
:root{--ink:#1a1208;--parchment:#f5e6c8;--parchment-dark:#e8d5a8;--parchment-deep:#d4b878;--crimson:#8b1a1a;--crimson-l:#c0392b;--gold:#c9922a;--gold-l:#e8b84b;--ink-light:#5c4033;--panel:#12100e;--panel-border:#3a2a18}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'EB Garamond',Georgia,serif;background:var(--panel);color:var(--parchment);min-height:100vh}
.wrap{max-width:1100px;margin:0 auto;padding:0 0 60px}
.hdr{text-align:center;padding:32px 20px 18px;border-bottom:2px solid var(--panel-border);background:linear-gradient(180deg,#0d0b08,var(--panel))}
.hdr::before{content:'✦ ─── ✦ ─── ✦ ─── ✦ ─── ✦';display:block;color:var(--gold);opacity:.35;font-size:11px;letter-spacing:4px;margin-bottom:10px}
.hdr h1{font-family:'Cinzel Decorative',serif;font-size:clamp(16px,3vw,28px);color:var(--gold-l);text-shadow:0 0 30px rgba(201,146,42,.4),0 2px 4px rgba(0,0,0,.8);letter-spacing:2px}
.hdr p{color:var(--parchment-deep);font-style:italic;margin-top:5px;font-size:15px;opacity:.75}
.tabs{display:flex;border-bottom:2px solid var(--panel-border);background:#0d0b08}
.tab{flex:1;padding:13px 8px;background:none;border:none;border-bottom:3px solid transparent;color:var(--parchment-deep);font-family:'Cinzel',serif;font-size:12px;letter-spacing:1.5px;cursor:pointer;text-transform:uppercase;transition:all .2s}
.tab:hover{color:var(--gold-l)}
.tab.on{color:var(--gold-l);border-bottom-color:var(--gold);background:rgba(201,146,42,.05)}
.layout{display:grid;grid-template-columns:300px 1fr;min-height:80vh}
.ctrl{background:#0f0d0a;border-right:2px solid var(--panel-border);padding:24px 20px;display:flex;flex-direction:column;gap:16px}
.clbl{font-family:'Cinzel',serif;font-size:9px;letter-spacing:2px;text-transform:uppercase;color:var(--gold);opacity:.85;display:block;margin-bottom:5px}
.csel,.cinp{width:100%;background:#1e1810;border:1px solid var(--panel-border);color:var(--parchment);font-family:'EB Garamond',serif;font-size:15px;padding:7px 10px;border-radius:3px;outline:none;transition:border-color .2s;appearance:none}
.csel:focus,.cinp:focus{border-color:var(--gold)}
.csel{cursor:pointer}
.lvl-row{display:flex;align-items:center;gap:10px}
.lvl-val{font-family:'Cinzel',serif;font-size:22px;color:var(--gold-l);min-width:30px;text-align:center}
.lvl-btn{width:30px;height:30px;background:#1e1810;border:1px solid var(--panel-border);color:var(--gold);font-size:18px;cursor:pointer;border-radius:3px;line-height:1;transition:background .15s}
.lvl-btn:hover{background:#2a2010;border-color:var(--gold)}
.gen-btn{width:100%;padding:12px;background:linear-gradient(135deg,var(--crimson),#6b1212);border:1px solid #a02020;color:var(--parchment);font-family:'Cinzel',serif;font-size:12px;letter-spacing:2px;text-transform:uppercase;cursor:pointer;border-radius:3px;transition:all .2s;box-shadow:0 2px 12px rgba(139,26,26,.4)}
.gen-btn:hover{background:linear-gradient(135deg,var(--crimson-l),var(--crimson));box-shadow:0 4px 20px rgba(139,26,26,.6);transform:translateY(-1px)}
.gen-btn:disabled{opacity:.4;cursor:not-allowed;transform:none}
.prt-btn{width:100%;padding:9px;background:transparent;border:1px solid var(--gold);color:var(--gold);font-family:'Cinzel',serif;font-size:10px;letter-spacing:2px;text-transform:uppercase;cursor:pointer;border-radius:3px;transition:all .2s}
.prt-btn:hover{background:rgba(201,146,42,.1)}
.divider{border:none;border-top:1px solid var(--panel-border)}
.cls-hint{font-size:12px;color:var(--parchment-deep);line-height:1.7}
.cls-hint span{color:var(--gold);font-family:'Cinzel',serif;font-size:9px;letter-spacing:1.5px}
.card-area{padding:24px;background:#12100e;overflow-y:auto}
.empty{display:flex;align-items:center;justify-content:center;height:350px;flex-direction:column;gap:10px;opacity:.25}
.empty-ico{font-size:60px;color:var(--gold)}
.empty p{font-family:'Cinzel',serif;font-size:13px;letter-spacing:2px;text-transform:uppercase}
.card{background:var(--parchment);color:var(--ink);border:3px solid var(--parchment-deep);border-radius:4px;box-shadow:0 0 0 1px #b89040,inset 0 0 80px rgba(180,140,60,.06),0 8px 40px rgba(0,0,0,.6)}
.card-hdr{background:var(--crimson);padding:16px 22px 12px;border-bottom:3px solid var(--parchment-deep)}
.card-hdr h2{font-family:'Cinzel',serif;font-size:24px;font-weight:700;color:var(--parchment);letter-spacing:1px;text-shadow:0 1px 3px rgba(0,0,0,.5)}
.card-hdr p{color:var(--parchment-deep);font-size:13px;font-style:italic;margin-top:2px;opacity:.9}
.card-body{padding:18px 22px;display:grid;grid-template-columns:1fr 1fr;gap:16px}
.full{grid-column:1/-1}
.sec-ttl{font-family:'Cinzel',serif;font-size:9px;letter-spacing:2.5px;text-transform:uppercase;color:var(--crimson);border-bottom:1px solid var(--parchment-deep);padding-bottom:3px;margin-bottom:8px}
.ab-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:5px}
.ab-box{background:var(--parchment-dark);border:1px solid var(--parchment-deep);border-radius:3px;text-align:center;padding:5px 2px}
.ab-key{font-family:'Cinzel',serif;font-size:8px;letter-spacing:1px;color:var(--crimson);display:block}
.ab-score{font-size:19px;font-weight:500;display:block;line-height:1.1}
.ab-mod{font-size:11px;color:var(--ink-light);display:block}
.cbt-row{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-bottom:7px}
.cbt-box{background:var(--parchment-dark);border:1px solid var(--parchment-deep);border-radius:3px;padding:7px 4px;text-align:center}
.cbt-lbl{font-family:'Cinzel',serif;font-size:7px;letter-spacing:1.5px;text-transform:uppercase;color:var(--crimson);display:block}
.cbt-val{font-size:20px;font-weight:500;display:block;line-height:1.1}
.saves-tbl{width:100%;border-collapse:collapse;font-size:13px}
.saves-tbl td{padding:2px 5px;border-bottom:1px solid rgba(180,140,60,.2)}
.saves-tbl td:last-child{text-align:right;font-weight:500;font-family:'Cinzel',serif}
.spells{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:8px}
.sp-box{background:var(--parchment-dark);border:1px solid var(--parchment-deep);border-radius:3px;padding:3px 7px;min-width:34px;text-align:center}
.sp-lvl{font-size:8px;color:var(--crimson);font-family:'Cinzel',serif;display:block}
.sp-cnt{font-size:17px;font-weight:500;display:block}
.spell-names{font-size:12px;color:var(--ink-light);font-style:italic;line-height:1.5;margin-top:2px}
.spell-row{margin-bottom:4px}
.spell-row strong{font-style:normal;font-size:11px;font-family:'Cinzel',serif;letter-spacing:.5px;color:var(--crimson);text-transform:uppercase}
.eq-row{padding:3px 0;border-bottom:1px solid rgba(180,140,60,.14);font-size:13px;display:flex;justify-content:space-between;align-items:baseline;gap:6px}
.eq-row:last-child{border-bottom:none}
.eq-det{color:var(--ink-light);font-size:12px;text-align:right;flex-shrink:0}
.spec-tag{background:var(--crimson);color:var(--parchment);font-size:8px;font-family:'Cinzel',serif;letter-spacing:1px;padding:1px 4px;border-radius:2px;margin-left:5px;vertical-align:middle}
.spec-list{list-style:none}
.spec-item{padding:3px 0 3px 13px;border-bottom:1px solid rgba(180,140,60,.12);font-size:12px;position:relative;line-height:1.4}
.spec-item:before{content:'▶';position:absolute;left:0;color:var(--crimson);font-size:8px;top:6px}
.spec-item:last-child{border-bottom:none}
.lang-wrap{display:flex;flex-wrap:wrap;gap:4px}
.lang-tag{background:var(--parchment-dark);border:1px solid var(--parchment-deep);font-size:11px;padding:2px 7px;border-radius:2px}
.extra-block{background:rgba(139,26,26,.07);border:1px solid rgba(139,26,26,.2);border-radius:3px;padding:9px 12px;margin-top:3px;font-size:13px}
.extra-block p{margin:2px 0}
.note-txt{font-size:11px;color:var(--ink-light);font-style:italic;margin-top:3px}
.mc-card{background:var(--parchment);color:var(--ink);border:3px solid var(--parchment-deep);border-radius:4px;box-shadow:0 0 0 1px #b89040,0 8px 40px rgba(0,0,0,.6);overflow:hidden}
.mc-hdr{background:var(--ink);padding:12px 18px;display:grid;grid-template-columns:1fr 1fr;gap:8px;border-bottom:2px solid var(--gold)}
.mc-hf{display:flex;flex-direction:column;gap:2px}
.mc-hl{font-family:'Cinzel',serif;font-size:7px;letter-spacing:2px;color:var(--gold);text-transform:uppercase}
.mc-hv{font-family:'Cinzel',serif;font-size:15px;color:var(--parchment)}
.mc-body{padding:14px 18px;display:grid;grid-template-columns:1fr 1fr;gap:12px}
.mc-row{display:flex;justify-content:space-between;border-bottom:1px solid rgba(180,140,60,.2);padding:4px 0;font-size:13px}
.mc-rv{font-weight:500;font-family:'Cinzel',serif;font-size:14px}
.poa-section{grid-column:1/-1;display:grid;grid-template-columns:140px 1fr;gap:16px;padding-top:10px;border-top:1px solid rgba(180,140,60,.3)}
.poa-big{font-family:'Cinzel',serif;font-size:48px;color:var(--crimson);text-align:center;line-height:1}
.poa-lbl{font-family:'Cinzel',serif;font-size:8px;letter-spacing:2px;text-transform:uppercase;text-align:center;color:var(--ink-light);margin-top:3px}
.poa-sub{font-size:11px;color:var(--ink-light);font-style:italic;text-align:center;margin-top:4px}
.cpoa-list{font-size:12px}
.cpoa-item{padding:2px 0;border-bottom:1px solid rgba(180,140,60,.15)}
.ab-tags{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:5px;padding-top:8px;border-top:1px solid rgba(180,140,60,.3)}
.ab-tag{background:var(--ink);color:var(--parchment);font-family:'Cinzel',serif;font-size:10px;letter-spacing:1px;padding:3px 9px;border-radius:2px;text-transform:uppercase}
.chk-grp{display:flex;flex-wrap:wrap;gap:7px}
.chk-item{display:flex;align-items:center;gap:5px;cursor:pointer;font-size:13px;color:var(--parchment)}
.chk-item input{accent-color:var(--gold);cursor:pointer;width:14px;height:14px}
@media print{body{background:white}.hdr,.tabs,.ctrl{display:none!important}.layout{display:block}.card-area{padding:0}.card,.mc-card{box-shadow:none;border-color:#999}}
</style>
</head>
<body>
<div class="wrap">
  <div class="hdr">
    <h1>Middle Sea — OSE Generator</h1>
    <p>Old-School Essentials · Custom Campaign · v7</p>
  </div>
  <div class="tabs">
    <button class="tab on" onclick="switchTab('npc',this)">NPC Generator</button>
    <button class="tab" onclick="switchTab('mc',this)">Mass Combat</button>
    <button class="tab" onclick="switchTab('spells',this)">Spell Lists</button>
    <button class="tab" onclick="switchTab('equip',this)">Equipment</button>
    <button class="tab" onclick="switchTab('ref',this)">Reference</button>
  </div>
  <div id="tab-npc" class="layout">
    <div class="ctrl">
      <div><label class="clbl">Race</label><select class="csel" id="race-sel" onchange="onRaceChange()"></select></div>
      <div style="display:flex;align-items:center;gap:8px">
        <label class="chk-item" style="font-family:'Cinzel',serif;font-size:10px;letter-spacing:1.5px;text-transform:uppercase;color:var(--gold)">
          <input type="checkbox" id="mc-toggle" onchange="toggleMulticlass()" style="accent-color:var(--gold)"> Multiclass
        </label>
      </div>
      <div id="cls1-block">
        <label class="clbl">Class 1</label>
        <select class="csel" id="cls-sel" onchange="onClassChange()"><option value="">— Select class —</option></select>
        <div style="margin-top:6px">
          <label class="clbl">Level</label>
          <div class="lvl-row">
            <button class="lvl-btn" onclick="changeLevel(-1,1)">−</button>
            <span class="lvl-val" id="lvl-display">1</span>
            <button class="lvl-btn" onclick="changeLevel(1,1)">+</button>
          </div>
        </div>
      </div>
      <div id="cls2-block" style="display:none">
        <label class="clbl">Class 2</label>
        <select class="csel" id="cls2-sel" onchange="onClass2Change()"><option value="">— Select class —</option></select>
        <div style="margin-top:6px">
          <label class="clbl">Level</label>
          <div class="lvl-row">
            <button class="lvl-btn" onclick="changeLevel(-1,2)">−</button>
            <span class="lvl-val" id="lvl2-display">1</span>
            <button class="lvl-btn" onclick="changeLevel(1,2)">+</button>
          </div>
        </div>
      </div>
      <div id="cls3-block" style="display:none">
        <label class="clbl">Class 3 (optional)</label>
        <select class="csel" id="cls3-sel" onchange="onClass3Change()"><option value="">— None —</option></select>
        <div id="cls3-lvl-row" style="display:none;margin-top:6px">
          <label class="clbl">Level</label>
          <div class="lvl-row">
            <button class="lvl-btn" onclick="changeLevel(-1,3)">−</button>
            <span class="lvl-val" id="lvl3-display">1</span>
            <button class="lvl-btn" onclick="changeLevel(1,3)">+</button>
          </div>
        </div>
      </div>
      <hr class="divider">
      <button class="gen-btn" id="gen-btn" onclick="generateNPC()" disabled>✦ Generate NPC ✦</button>
      <button class="prt-btn" id="prt-npc" onclick="window.print()" style="display:none">⎙ Print / Save PDF</button>
      <hr class="divider">
      <div class="cls-hint" id="cls-hint"></div>
    </div>
    <div class="card-area" id="npc-out"><div class="empty"><div class="empty-ico">⚔</div><p>Generate an NPC to begin</p></div></div>
  </div>
  <div id="tab-mc" class="layout" style="display:none">
    <div class="ctrl">
      <div><label class="clbl">Unit Name</label><input class="cinp" id="mc-name" placeholder="e.g. Vakka's Bane"></div>
      <div><label class="clbl">Total Troops</label><input class="cinp" type="number" id="mc-troops" value="100" min="1"></div>
      <div><label class="clbl">Hit Dice (per member)</label><input class="cinp" type="number" id="mc-hd" value="1" min="0.5" step="0.5"></div>
      <div>
        <label class="clbl">Armour Class</label>
        <input class="cinp" type="number" id="mc-ac" value="7" min="0" max="10" oninput="updateFootHint()">
        <div id="foot-hint" style="font-size:11px;color:var(--parchment-deep);margin-top:3px">→ Light Foot</div>
      </div>
      <div>
        <label class="clbl">Combat Move Rate</label>
        <input class="cinp" type="number" id="mc-move" value="120" min="10" step="10" oninput="updateMoveHint()">
        <div id="move-hint" style="font-size:11px;color:var(--parchment-deep);margin-top:3px">→ Movement 12</div>
      </div>
      <div><label class="clbl">Damage (single member)</label><input class="cinp" id="mc-dmg" value="1d8"></div>
      <div><label class="clbl">Mount Type</label>
        <select class="csel" id="mc-mount">
          <option value="None">None (foot)</option>
          <option value="Light Small">Light Small</option><option value="Light Medium">Light Medium</option>
          <option value="Light Large">Light Large</option><option value="Heavy Small">Heavy Small</option>
          <option value="Heavy Medium">Heavy Medium</option><option value="Heavy Large">Heavy Large</option>
        </select>
      </div>
      <div><label class="clbl">Cohesion</label>
        <select class="csel" id="mc-cohesion">
          <option>Green</option><option>Shaken</option><option selected>Steady</option><option>Veteran</option><option>Elite</option>
        </select>
      </div>
      <div><label class="clbl">Abilities</label><div class="chk-grp" id="mc-abilities"></div></div>
      <hr class="divider">
      <button class="gen-btn" onclick="buildMCUnit()">✦ Generate Unit Card ✦</button>
      <button class="prt-btn" id="prt-mc" onclick="window.print()" style="display:none">⎙ Print / Save PDF</button>
    </div>
    <div class="card-area" id="mc-out"><div class="empty"><div class="empty-ico">⚔</div><p>Build a unit to generate its stat block</p></div></div>
  </div>

  <!-- SPELL LISTS TAB -->
  <div id="tab-spells" style="display:none;padding:28px;background:#12100e">
    <div id="spells-content"></div>
  </div>
  <!-- EQUIPMENT TAB -->
  <div id="tab-equip" style="display:none;padding:28px;background:#12100e">
    <div id="equip-content"></div>
  </div>
  <!-- REFERENCE TAB -->
  <div id="tab-ref" style="display:none;padding:28px;background:#12100e">
    <div id="ref-content"></div>
  </div>
</div>
<script>

function getSpellListForClass(clsKey, cd) {
  // Sorcerer has its own list in JSON
  if(clsKey === 'Sorcerer') return {list: GD.classes.Sorcerer.spells, type:'arcane', label:'Sorcerer'};

  const note = ((cd.spellList||'')+(cd.note||'')).toLowerCase();

  // ChaosKnight must be checked BEFORE the generic cleric-note match,
  // otherwise its "cleric spell list" note routes it to plain Cleric and
  // the reversed-spell flag is never applied.
  if(clsKey==='ChaosKnight') return {list:SPELL_LISTS.cleric, type:'divine', label:'Cleric (reversed)', reversed:true};
  if(clsKey==='Cleric'||note.includes('cleric spell')) return {list:SPELL_LISTS.cleric, type:'divine', label:'Cleric'};
  if(clsKey==='Paladin') return {list:SPELL_LISTS.cleric, type:'divine', label:'Cleric'};
  if(clsKey==='Druid'||note.includes('druid spell')) return {list:SPELL_LISTS.druid, type:'divine', label:'Druid'};
  if(clsKey==='Ranger'||note.includes('druid spell')) return {list:SPELL_LISTS.druid, type:'divine', label:'Druid'};
  if(clsKey==='WoodElf') return {list:SPELL_LISTS.druid, type:'divine', label:'Druid'};
  if(clsKey==='Bard') return {list:SPELL_LISTS.druid, type:'divine', label:'Druid'};
  if(clsKey==='Illusionist'||note.includes('illusionist')) return {list:SPELL_LISTS.illusionist, type:'arcane', label:'Illusionist'};
  if(clsKey==='Gnome') return {list:SPELL_LISTS.illusionist, type:'arcane', label:'Illusionist'};
  if(clsKey==='Runegraver') return {list:SPELL_LISTS['magic-user'], type:'arcane', label:'Magic-User (Runes)'};
  if(clsKey==='Drow') return {list:SPELL_LISTS.cleric, type:'divine', label:'Cleric'};

  if(clsKey==='Necromancer') return {list:SPELL_LISTS.necromancer, type:'arcane', label:'Necromancer'};

  // Default: MU list for all arcane (Elf, AquaticElf, HalfElf, PhaseElf, Triton, Magic-User, Mage…)
  return {list:SPELL_LISTS['magic-user'], type:'arcane', label:'Magic-User'};
}

function pickSpells(spellsPerDay, spellListData, reversed) {
  if(!spellsPerDay || !spellListData) return null;
  const result = {};
  spellsPerDay.forEach((count, i) => {
    if(!count || count === 0) return;
    const lvl = i+1;
    const pool = spellListData[lvl] || spellListData[String(lvl)] || [];
    if(!pool.length) return;
    const shuffled = [...pool].sort(()=>Math.random()-.5);
    let picked = shuffled.slice(0, Math.min(count, pool.length));
    if(reversed) {
      // Prefix "Reverse:" to indicate reversed cleric spells
      picked = picked.map(s => 'Reverse: '+s);
    }
    result[lvl] = {count, spells: picked};
  });
  return Object.keys(result).length ? result : null;
}

// Returns {allowed: bool, maxLevel: number|null, reason: string}
function checkRaceClassCompatibility(raceName, clsKey) {
  if(!raceName || !clsKey) return {allowed:true, maxLevel:null, reason:''};

  const classData = GD.classes[clsKey];
  if(!classData) return {allowed:true, maxLevel:null, reason:''};

  // ── LYCANTHROPES — available to any race (own class progression) ──────────
  if(classData.type === 'Lycanthrope') {
    return {allowed:true, maxLevel: classData.maxLevel || 14, reason:''};
  }

  // ── HUMAN ────────────────────────────────────────────────────────────────
  if(raceName === 'Human') {
    if(HUMAN_EXCLUDED_CLASSES.has(clsKey)) {
      return {allowed:false, maxLevel:null, reason:`Humans cannot be ${clsKey} — this is a demihuman class.`};
    }
    return {allowed:true, maxLevel: classData.maxLevel || 14, reason:''};
  }

  // ── CLASS NAME MATCHES RACE — always valid ────────────────────────────────
  if(clsKey === raceName) {
    return {allowed:true, maxLevel: classData.maxLevel || 14, reason:''};
  }

  // ── NORMALISED KEY LOOKUP HELPER ──────────────────────────────────────────
  function normLookup(map, key) {
    const n = key.replace(/[-\s]/g,'').toLowerCase();
    for(const [k,v] of Object.entries(map)) {
      if(k.replace(/[-\s]/g,'').toLowerCase() === n) return v;
    }
    return null;
  }

  // ── RACES WITH newClasses: merge base OSE list + newClasses ───────────────
  if(NEW_CLASSES_RACES.has(raceName)) {
    // Build merged map: base OSE classes + JSON classes + campaign newClasses
    const base = BASE_OSE_CLASSES[raceName] || {};
    const raceData = GD.availableClassesAndMaxLevels?.newClassesForRaces?.[raceName] || {};
    const jsonCls = raceData.classes || {};
    const newCls = raceData.newClasses || {};
    const merged = {...base, ...jsonCls, ...newCls};

    // Also allow the demihuman race-class itself
    if(clsKey === raceName) return {allowed:true, maxLevel: classData.maxLevel||14, reason:''};

    const found = normLookup(merged, clsKey);
    if(found !== null && found !== undefined) {
      const ml = found === 'unlimited' ? (classData.maxLevel||14) : Math.min(found, classData.maxLevel||14);
      return {allowed:true, maxLevel: ml, reason:''};
    }
    const allowedList = [raceName, ...Object.keys(merged)].join(', ');
    return {allowed:false, maxLevel:null, reason:`${raceName}s cannot be ${clsKey}. Allowed: ${allowedList}.`};
  }

  // ── RACES WITH EXPLICIT CLASS LIST ────────────────────────────────────────
  const raceClassMap = getRaceClassData(raceName);
  if(!raceClassMap) {
    return {allowed:true, maxLevel: classData.maxLevel||14, reason:''};
  }

  if(raceClassMap.allNonDemihumanClasses) {
    if(HUMAN_EXCLUDED_CLASSES.has(clsKey)) {
      return {allowed:false, maxLevel:null, reason:`${raceName} cannot be ${clsKey}.`};
    }
    return {allowed:true, maxLevel: classData.maxLevel||14, reason:''};
  }

  const found = normLookup(raceClassMap, clsKey);
  if(found !== null && found !== undefined) {
    const ml = found === 'unlimited' ? (classData.maxLevel||14) : Math.min(found, classData.maxLevel||14);
    return {allowed:true, maxLevel: ml, reason:''};
  }

  const allowedList = Object.keys(raceClassMap).join(', ');
  return {allowed:false, maxLevel:null, reason:`${raceName}s cannot be ${clsKey}. Allowed classes: ${allowedList}.`};
}

function updateValidation(cls,race,which){
  which=which||1;
  const hint=document.getElementById('cls-hint');
  if(!cls)return;
  const cd=GD.classes[cls];if(!cd)return;
  const compat=checkRaceClassCompatibility(race,cls);
  const effectiveMax=compat.allowed?(compat.maxLevel||cd.maxLevel||14):(cd.maxLevel||14);
  if(which===1){
    if(!compat.allowed){
      hint.innerHTML=`<span style="color:#e05555;font-family:'Cinzel',serif;font-size:10px;letter-spacing:1px">⚠ INVALID COMBINATION</span><br><span style="color:#e08888;font-size:12px">${compat.reason}</span>`;
    } else {
      maxLevel=effectiveMax;
      if(currentLevel>maxLevel){currentLevel=maxLevel;document.getElementById('lvl-display').textContent=currentLevel;}
      const raceNote=(race&&race!=='Human'&&compat.maxLevel&&compat.maxLevel<(cd.maxLevel||14))?`<br><span style="color:#e8b84b;font-size:11px">⚑ ${race} max: ${compat.maxLevel}</span>`:'';
      hint.innerHTML=`<span>HD</span> ${cd.hd} &nbsp; <span>MAX</span> ${effectiveMax}${raceNote}<br><span>TYPE</span> ${cd.type||'—'}<br>${cd.alignment?`<span>ALIGN</span> ${cd.alignment}<br>`:''}<span>MARTIAL</span> ${cd.martialCategory||'—'}`;
    }
  }
  if(which===2){maxLevel2=effectiveMax;if(currentLevel2>maxLevel2){currentLevel2=maxLevel2;document.getElementById('lvl2-display').textContent=currentLevel2;}}
  if(which===3){maxLevel3=effectiveMax;if(currentLevel3>maxLevel3){currentLevel3=maxLevel3;document.getElementById('lvl3-display').textContent=currentLevel3;}}
}

// ── DICE ─────────────────────────────────────────────────────────────────────
function roll(n){return Math.floor(Math.random()*n)+1}
function rollStat(){const r=[roll(6),roll(6),roll(6),roll(6)].sort((a,b)=>a-b);return r[1]+r[2]+r[3]}
function getMod(s){return ABILITY_MODS[Math.min(18,Math.max(3,s))]??0}
function fmtMod(n){return n>=0?'+'+n:''+n}
function getHDType(hd){const m=(hd||'d8').match(/d(\d+)/);return m?parseInt(m[1]):8}
function pickRand(arr,n){const a=[...arr].sort(()=>Math.random()-.5);return a.slice(0,Math.min(n,a.length))}

// ── NPC GENERATION ────────────────────────────────────────────────────────────
function generateNPC(){
  const clsKey=document.getElementById('cls-sel').value;
  const raceName=document.getElementById('race-sel').value;
  if(!clsKey)return;
  const classes2=[{key:clsKey,level:currentLevel}];
  if(isMulticlass){
    const k2=document.getElementById('cls2-sel').value;
    if(k2) classes2.push({key:k2,level:currentLevel2});
    const k3=document.getElementById('cls3-sel').value;
    if(k3) classes2.push({key:k3,level:currentLevel3});
  }
  const isMulti=classes2.length>1;
  const numClasses=classes2.length;
  const cd=GD.classes[clsKey];
  const level=currentLevel;
  const raceMods=RACIAL_MODS[raceName]||{};
  const raceData=GD.availableClassesAndMaxLevels?.newClassesForRaces?.[raceName]||null;

  // Stats
  const stats={};
  ['STR','INT','WIS','DEX','CON','CHA'].forEach(k=>{stats[k]=Math.min(18,Math.max(3,rollStat()+(raceMods[k]||0)));});
  const mods={};Object.keys(stats).forEach(k=>mods[k]=getMod(stats[k]));

  let hp=0;
  if(!isMulti){
    const hdType=getHDType(cd.hd);
    const hdCount=cd.hdCount?cd.hdCount[Math.min(level-1,cd.hdCount.length-1)]:level;
    const hdBonus=cd.hdBonus?cd.hdBonus[Math.min(level-1,cd.hdBonus.length-1)]:0;
    for(let i=0;i<hdCount;i++)hp+=Math.max(1,roll(hdType)+mods.CON);hp=Math.max(1,hp+hdBonus);
  } else {
    let tot=0;
    classes2.forEach(c=>{const ccd=GD.classes[c.key];if(!ccd)return;const ht=getHDType(ccd.hd);const hc=ccd.hdCount?ccd.hdCount[Math.min(c.level-1,ccd.hdCount.length-1)]:c.level;const hb=ccd.hdBonus?ccd.hdBonus[Math.min(c.level-1,ccd.hdBonus.length-1)]:0;let sub=0;for(let i=0;i<hc;i++)sub+=Math.max(1,roll(ht)+mods.CON);sub+=hb;tot+=sub;});
    hp=Math.max(1,Math.floor(tot/numClasses));
  }

  // Armor / weapons
  const {armor,shield}=pickArmor(cd,level);
  const ac=computeAC(cd,clsKey,armor,shield,mods.DEX,level);
  const weapons=pickWeapons(cd,clsKey,level);

  let thac0=(cd.thac0||[])[Math.min(level-1,(cd.thac0||[]).length-1)]??19;
  let saves=((cd.saves||[])[Math.min(level-1,(cd.saves||[]).length-1)])||[12,13,14,15,16];
  if(isMulti){classes2.forEach(c=>{const ccd=GD.classes[c.key];if(!ccd)return;const ct=(ccd.thac0||[])[Math.min(c.level-1,(ccd.thac0||[]).length-1)]??19;if(ct<thac0)thac0=ct;const cs=((ccd.saves||[])[Math.min(c.level-1,(ccd.saves||[]).length-1)])||[];saves=saves.map((v,i)=>Math.min(v,(cs[i]??v)));});}

  let allSpellData=[];
  classes2.forEach(c=>{const ccd=GD.classes[c.key];if(!ccd)return;const spdArr=ccd.spellsPerDay||ccd.runeSpellsPerDay;const spdRow=spdArr?spdArr[Math.min(c.level-1,spdArr.length-1)]:null;if(spdRow&&spdRow.some(x=>x>0)){const info=getSpellListForClass(c.key,ccd);allSpellData.push({key:c.key,perDay:spdRow,known:pickSpells(spdRow,info.list,info.reversed),label:info.label+(isMulti?` (${c.key})`:'')}); } });
  const spellData=allSpellData.length?allSpellData:null;

  // Artificer gadgets
  let gadgetData=null;
  if(cd.gadgetProgression){
    const gp=cd.gadgetProgression[Math.min(level-1,cd.gadgetProgression.length-1)];
    gadgetData={
      powers: pickRand(GADGET_POWERS, gp.gadgetPowers),
      points: gp.gadgetPoints,
      count: gp.gadgetPowers
    };
  }

  const aligns=cd.alignments||['Lawful','Neutral','Chaotic'];
  const alignment=aligns[Math.floor(Math.random()*aligns.length)];
  const specials=(cd.special||[]).filter(s=>{const m=s.match(/(\d+)(st|nd|rd|th) level/);return !m||parseInt(m[1])<=level;});
  const langs=buildLanguages(cd,raceData,stats.INT);
  let extras=buildExtras(cd,clsKey,level);
  if(isMulti){
    // Primary built above; merge in each additional class's extras (skills, acrobat/ninja
    // skills, mutations, bloodline, etc.) so e.g. a Fighter/Thief shows thief skill %.
    classes2.slice(1).forEach(c=>{const ccd=GD.classes[c.key];if(!ccd)return;const ce=buildExtras(ccd,c.key,c.level);Object.keys(ce).forEach(k=>{if(extras[k]===undefined)extras[k]=ce[k];});});
  }

  const titleStr=isMulti?classes2.map(c=>`${c.key} ${c.level}`).join(' / '):clsKey;
  const subtitleStr=isMulti?`Multiclass · ${alignment}`:`Level ${level} · ${alignment}${cd.martialCategory?' · '+cap(cd.martialCategory):''}`;
  renderNPC({clsKey,raceName,level,stats,mods,hp,ac,thac0,saves,spellData,gadgetData,alignment,specials,langs,weapons,armor,shield,extras,cd,titleStr,subtitleStr});
}

function pickArmor(cd,level){
  const armorList=GD.customArmor?.armor||[];
  const shieldList=[...(GD.customArmor?.shields||[]),...EXTRA_SHIELDS];
  const restr=(Array.isArray(cd.armor)?cd.armor.join(' '):(cd.armor||'')).toLowerCase();
  let eligible=[],eligibleShields=[];
  if(restr.includes('shields only')){eligibleShields=shieldList;}
  else if(!restr||restr==='none'){/* nothing */}
  else if(restr.includes('any')||restr.includes('all')){eligible=armorList;if(!restr.includes('no shield'))eligibleShields=shieldList;}
  else if(restr.includes('plate')){eligible=armorList;eligibleShields=shieldList;}
  else if(restr.includes('chain')||restr.includes('mail')){eligible=armorList.filter(a=>a.category!=='Plate mail');eligibleShields=shieldList;}
  else if(restr.includes('leather')){eligible=armorList.filter(a=>a.category==='Leather');if(restr.includes('shield'))eligibleShields=shieldList;}
  if(restr.includes('no shield'))eligibleShields=[];
  const wantsBest=cd.special&&cd.special.some(s=>s.toLowerCase().includes('heaviest'));
  let armor=null;
  if(eligible.length){
    const sorted=[...eligible].sort((a,b)=>a.ac-b.ac);
    if(wantsBest)armor=sorted[0];
    else{const idx=Math.min(sorted.length-1,Math.floor(Math.random()*Math.ceil(sorted.length*(level/10+0.5))));armor=sorted[idx];}
  }
  let shield=null;
  if(eligibleShields.length&&Math.random()>0.3)shield=eligibleShields[Math.floor(Math.random()*eligibleShields.length)];
  return{armor,shield};
}

function computeAC(cd,clsKey,armor,shield,dexMod,level){
  if(cd.naturalACByLevel){let ac=cd.naturalACByLevel[Math.min(level-1,cd.naturalACByLevel.length-1)];if(shield)ac-=shield.acBonus;return ac;}
  if(clsKey==='Kineticist'){return[9,8,7,6,5,4,3,2,1,0,-1,-2,-3,-3][Math.min(level-1,13)];}
  if(clsKey==='Monk')return cd.progression?.[Math.min(level-1,cd.progression.length-1)]?.naturalAC??9;
  let ac=armor?armor.ac:9;
  let dex=dexMod;
  if(armor?.note?.includes('no DEX')||armor?.name==='Full Plate')dex=0;
  if(armor?.name==='Half Plate')dex=Math.min(1,dex);
  ac-=dex;if(shield)ac-=shield.acBonus;if(cd.naturalACBonus)ac-=cd.naturalACBonus;if(clsKey==='Dragonborn')ac-=1;
  return ac;
}

// ── CATEGORY-BASED WEAPON PROFICIENCY ────────────────────────────────────────
// Returns list of allowed weapon CATEGORIES (not individual weapons)
function getAllowedCategories(cd, clsKey) {
  const weaponList = GD.customWeapons?.weapons || [];
  const catSummary = GD.customWeapons?.categorySummary || {};
  const wl = (Array.isArray(cd.weapons) ? cd.weapons.join(' ') : (cd.weapons||'')).toLowerCase();
  // "NA"/"NA (no category / exotic)" is a data bucket for exotic weapons, NOT an
  // OSE proficiency category — it must never appear in a proficiency pool.
  const isRealCat = c => !!c && !/^NA\b/.test(c);

  // Special cases
  if(clsKey==='Knight' || (cd.special&&cd.special.some(s=>s.toLowerCase().includes('melee only')))) {
    // Melee categories only — exclude missile
    const meleeCats = new Set();
    weaponList.forEach(w => { if(w.qualities&&w.qualities.includes('Melee')&&!w.qualities.includes('Missile')) meleeCats.add(w.category); });
    return [...meleeCats].filter(isRealCat).sort();
  }
  if(clsKey==='Monk' || wl.includes('monk weapon')) {
    const mc = new Set(); weaponList.filter(w=>w.qualities&&w.qualities.includes('Monk')).forEach(w=>mc.add(w.category)); return [...mc].filter(isRealCat).sort();
  }
  if(clsKey==='Ninja' || wl.includes('ninja weapon')) {
    const nc = new Set(); weaponList.filter(w=>w.qualities&&w.qualities.includes('Ninja')).forEach(w=>nc.add(w.category)); return [...nc].filter(isRealCat).sort();
  }
  if(wl.includes('blunt')) {
    const bc = new Set(); weaponList.filter(w=>w.qualities&&w.qualities.includes('Blunt')).forEach(w=>bc.add(w.category)); return [...bc].filter(isRealCat).sort();
  }
  if((wl.includes('any')&&!wl.includes('no longbow')&&!wl.includes('small')&&!wl.includes('size'))
     || clsKey==='Fighter'||clsKey==='Barbarian'||clsKey==='Assassin'||clsKey==='Ranger'
     || clsKey==='Paladin'||clsKey==='ChaosKnight'||clsKey==='Samurai'||clsKey==='Runegraver') {
    return Object.keys(catSummary).filter(isRealCat).sort();
  }
  // Size restricted (no longbow, no two-handed sword)
  if(wl.includes('no longbow')||wl.includes('small')) {
    const all = Object.keys(catSummary).filter(c=>isRealCat(c)&&c!=='Long bow'&&c!=='Two-handed sword'); return all.sort();
  }
  // Specific category lists
  const allowed = new Set();
  const catMap = {
    'dagger': 'Dagger', 'sword': 'Sword', 'short sword': 'Short sword',
    'two-handed sword': 'Two-handed sword', 'staff': 'Staff', 'spear': 'Spear',
    'club': 'Club', 'sling': 'Sling', 'pole arm': 'Pole arm', 'lance': 'Lance',
    'mace': 'Mace', 'hand axe': 'Hand axe', 'battle axe': 'Battle axe',
    'long bow': 'Long bow', 'short bow': 'Short bow', 'crossbow': 'Crossbow',
    'javelin': 'Javelin', 'war hammer': 'War hammer',
  };
  Object.entries(catMap).forEach(([key,cat]) => { if(wl.includes(key)) allowed.add(cat); });
  if(wl.includes('missile')) ['Long bow','Short bow','Crossbow','Sling','Javelin'].forEach(c=>allowed.add(c));
  if(wl.includes('one-handed melee')) {
    weaponList.filter(w=>w.qualities&&w.qualities.includes('Melee')&&!w.qualities.includes('Two-handed')).forEach(w=>{if(isRealCat(w.category))allowed.add(w.category);});
  }
  return allowed.size ? [...allowed].filter(isRealCat).sort() : Object.keys(catSummary).filter(isRealCat).slice(0,4).sort();
}

// Get one representative weapon from a category
function getRepWeapon(category) {
  const weapons = GD.customWeapons?.weapons || [];
  const inCat = weapons.filter(w => w.category === category);
  return inCat[Math.floor(Math.random()*inCat.length)] || null;
}

function pickWeapons(cd, clsKey, level) {
  const martCat = cd.martialCategory||'semiMartial';
  const initSlots = {martial:4,semiMartial:3,nonMartial:1}[martCat]||2;
  const thac0arr = cd.thac0||[];
  let extra=0, prev=thac0arr[0]??19;
  for(let i=1;i<Math.min(level,thac0arr.length);i++){if(thac0arr[i]<prev){extra++;prev=thac0arr[i];}}
  let slots = initSlots + extra;

  const allowedCats = getAllowedCategories(cd, clsKey);
  if(!allowedCats.length) return [];

  const chosen = []; // {category, weapon, specialized}
  const canSpec = martCat === 'martial';

  // Specialization uses 2 slots, picks a category
  if(canSpec && slots >= 2 && allowedCats.length > 0) {
    const cat = allowedCats[Math.floor(Math.random()*allowedCats.length)];
    const rep = getRepWeapon(cat);
    chosen.push({category:cat, weapon:rep, specialized:true});
    slots -= 2;
  }

  // Fill remaining slots with categories (no repeats)
  const rem = allowedCats.filter(c => !chosen.find(x=>x.category===c));
  for(let i=0; i<slots && rem.length>0; i++) {
    const idx = Math.floor(Math.random()*rem.length);
    const cat = rem.splice(idx,1)[0];
    const rep = getRepWeapon(cat);
    chosen.push({category:cat, weapon:rep, specialized:false});
  }
  return chosen;
}

function buildLanguages(cd,raceData,INT){
  const langs=new Set(['Common']);
  const add=arr=>(arr||[]).forEach(l=>{if(l==='Alignment'||l==='Nationality')langs.add('Cultural language of homeland');else langs.add(l);});
  add(cd.languages);if(raceData)add(raceData.languages);
  const extra={9:0,10:1,11:1,12:1,13:2,14:2,15:3,16:3,17:4,18:5}[Math.min(18,Math.max(3,INT))]||0;
  const pool=LANGUAGES.filter(l=>!langs.has(l));
  for(let i=0;i<extra&&pool.length;i++){const idx=Math.floor(Math.random()*pool.length);langs.add(pool.splice(idx,1)[0]);}
  return[...langs];
}

function buildExtras(cd,clsKey,level){
  const ex={};
  if(clsKey==='Dragonborn'){const d10=roll(10);const t=[null,{t:'Black',d:'Acid',s:"Line 5'×30'"},{t:'Black',d:'Acid',s:"Line 5'×30'"},{t:'Blue',d:'Lightning',s:"Line 5'×30'"},{t:'Blue',d:'Lightning',s:"Line 5'×30'"},{t:'Green',d:'Poison',s:"Cloud 10'×15'"},{t:'Green',d:'Poison',s:"Cloud 10'×15'"},{t:'Red',d:'Fire',s:"Cone 15'×20'"},{t:'Red',d:'Fire',s:"Cone 15'×20'"},{t:'White',d:'Cold',s:"Cone 15'×20'"},{t:'White',d:'Cold',s:"Cone 15'×20'"}];ex.bloodline=t[d10];}
  if(cd.mutationsTable){const tbl=[...cd.mutationsTable].sort(()=>Math.random()-.5);const picked=[];for(const m of tbl){if(picked.length>=2)break;if(!picked.find(p=>p.d8===m.d8))picked.push(m);}ex.mutations=picked;}
  if(cd.fiendishAppearanceTable){const rt=arr=>{const i=[],r=[];while(r.length<2){const x=Math.floor(Math.random()*arr.length);if(!i.includes(x)){i.push(x);r.push(arr[x]);}}return r;};ex.fiendish={appearance:rt(cd.fiendishAppearanceTable),gifts:rt(cd.fiendishGiftsTable||[])};}
  if(cd.mentalPowers){const p=Object.entries(cd.mentalPowers).sort(()=>Math.random()-.5);ex.mentalPowers=p.slice(0,Math.min(3+Math.floor((level-1)/2),p.length)).map(([k,v])=>({name:k,...v}));}
  if(cd.progression&&clsKey==='Monk')ex.monkProg=cd.progression[Math.min(level-1,cd.progression.length-1)];
  if(clsKey==='Mycelian'){ex.unarmed=cd.unarmedDamageByLevel?.[Math.min(level-1,5)]||'1d4';ex.height=(3+level)+"'";ex.natAC=cd.naturalACDisplayByLevel?.[Math.min(level-1,5)]||'6[13]';}
  if(clsKey==='ChaosKnight'||clsKey==='Chaos Knight'){if(level>=4)ex.infernalSteed="AC 5[14], 5+5 HD, Move 180'(60')";if(level>=3)ex.commandUndead=true;}
  if(cd.acrobatSkills)ex.acrobatSkills=cd.acrobatSkills[Math.min(level-1,cd.acrobatSkills.length-1)];
  if(cd.ninjaSkills)ex.ninjaSkills=cd.ninjaSkills[Math.min(level-1,cd.ninjaSkills.length-1)];
  if(cd.skillChanceByLevel){const defs=cd.skills||cd.skillKeys||{};ex.skills=Object.keys(cd.skillChanceByLevel).map(k=>({key:k,name:(defs[k]?.name||defs[k]||k),pct:cd.skillChanceByLevel[k][Math.min(level-1,cd.skillChanceByLevel[k].length-1)]}));}
  if(cd.type==='Lycanthrope'){const prog=cd.progression?.[Math.min(level-1,cd.progression.length-1)];ex.lycan={forms:cd.forms,prog,keys:cd.specialAbilityKeys};}
  return ex;
}

// ── RENDER NPC ────────────────────────────────────────────────────────────────
function renderNPC(n){
  const{clsKey,raceName,level,stats,mods,hp,ac,thac0,saves,spellData,gadgetData,alignment,specials,langs,weapons,armor,shield,extras,cd,titleStr,subtitleStr}=n;

  // Combat
  h+=`<div><div class="sec-ttl">Combat</div><div class="cbt-row"><div class="cbt-box"><span class="cbt-lbl">HP</span><span class="cbt-val">${hp}</span></div><div class="cbt-box"><span class="cbt-lbl">AC</span><span class="cbt-val" style="font-size:16px">${acStr}</span></div><div class="cbt-box"><span class="cbt-lbl">THAC0</span><span class="cbt-val" style="font-size:14px">${thac0str}</span></div></div></div>`;

  // Saves
  h+=`<div><div class="sec-ttl">Saving Throws</div><table class="saves-tbl"><tbody>`;
  SAVE_LABELS.forEach((l,i)=>{h+=`<tr><td>${l}</td><td>${saves[i]??'—'}</td></tr>`;});

  if(spellData&&spellData.length){

      if(sd.known){Object.entries(sd.known).forEach(([lvl,info])=>{h+=`<div class="spell-row"><strong>Level ${lvl}:</strong> <span class="spell-names">${info.spells.join(', ')}</span></div>`;});}
      h+=`</div>`;
    });
  }

  // Gadget powers
  if(gadgetData){
    h+=`<div class="full"><div class="sec-ttl">Gadget Powers (${gadgetData.count} known · ${gadgetData.points} pts/day)</div>`;
    gadgetData.powers.forEach(p=>{h+=`<div class="eq-row"><span>${p}</span></div>`;});
    h+=`</div>`;
  }

  // Armor
  h+=`<div><div class="sec-ttl">Armour &amp; Shield</div>`;
  if(armor)h+=`<div class="eq-row"><span>${armor.name}</span><span class="eq-det">AC ${armor.ac}</span></div>`;
  else h+=`<div class="eq-row"><span style="color:var(--ink-light);font-style:italic">No armour</span></div>`;
  if(shield)h+=`<div class="eq-row"><span>${shield.name}</span><span class="eq-det">+${shield.acBonus} AC</span></div>`;
  if(armor?.note)h+=`<div class="note-txt">${armor.note}</div>`;
  if(shield?.note)h+=`<div class="note-txt">${shield.note}</div>`;
  h+=`</div>`;

  // Weapons
  h+=`<div><div class="sec-ttl">Weapons &amp; Proficiencies</div>`;
  if(!weapons.length)h+=`<div class="eq-row"><span style="color:var(--ink-light);font-style:italic">Unarmed / class-specific</span></div>`;
  else weapons.forEach(w=>{
    const dmg = w.weapon ? w.weapon.damage : '—';

    h+=`<div class="eq-row"><span><strong>${w.category}</strong>${ex}${w.specialized?'<span class="spec-tag">SPEC</span>':''}</span><span class="eq-det">${dmg}${w.specialized?' +1/+1':''}</span></div>`;

  if(extras.unarmed){h+=`<div><div class="sec-ttl">Mycelian Traits</div><div class="eq-row"><span>Fist Damage</span><span>${extras.unarmed}</span></div><div class="eq-row"><span>Natural AC</span><span>${extras.natAC}</span></div><div class="eq-row"><span>Height</span><span>${extras.height}</span></div></div>`;}
  if(extras.bloodline){h+=`<div><div class="sec-ttl">Draconic Bloodline</div><div class="extra-block"><p><strong>${extras.bloodline.t}</strong> — ${extras.bloodline.d}</p><p>Breath: ${extras.bloodline.s}</p></div></div>`;}
  if(extras.mutations?.length){h+=`<div><div class="sec-ttl">Mutations</div>`;extras.mutations.forEach(m=>{h+=`<div class="extra-block" style="margin-bottom:4px"><p><strong>${m.mutation}:</strong> ${m.effect}</p></div>`;});h+=`</div>`;}
  if(extras.fiendish){h+=`<div><div class="sec-ttl">Fiendish Heritage</div><div class="extra-block"><p><strong>Appearance:</strong> ${extras.fiendish.appearance.join('; ')}</p><p><strong>Gifts:</strong> ${extras.fiendish.gifts.join('; ')}</p></div></div>`;}
  if(extras.mentalPowers?.length){h+=`<div class="full"><div class="sec-ttl">Mental Powers Known</div>`;extras.mentalPowers.forEach(p=>{h+=`<div class="eq-row" style="flex-direction:column;align-items:flex-start"><span style="font-weight:500">${p.name}</span><span style="font-size:11px;color:var(--ink-light)">${p.description}</span></div>`;});h+=`</div>`;}
  if(extras.skills?.length){h+=`<div><div class="sec-ttl">Skills</div>`;extras.skills.forEach(s=>{const val=(typeof s.pct==='number')?`${s.pct}%`:`${s.pct} (1d6)`;h+=`<div class="eq-row"><span>${s.name||s.key}</span><span>${val}</span></div>`;});h+=`</div>`;}
  if(extras.ninjaSkills){h+=`<div><div class="sec-ttl">Ninja Skills</div>`;Object.entries(extras.ninjaSkills).filter(([k])=>k!=='level').forEach(([k,v])=>{h+=`<div class="eq-row"><span>${{HP:'Hide/Pursue',HS:'Hide in Shadows',MS:'Move Silently',TW:'Tightrope Walk'}[k]||k}</span><span>${v}%</span></div>`;});h+=`</div>`;}
  if(extras.acrobatSkills){h+=`<div><div class="sec-ttl">Acrobat Skills</div>`;Object.entries(extras.acrobatSkills).filter(([k])=>k!=='level').forEach(([k,v])=>{h+=`<div class="eq-row"><span>${{CS:'Climb Sheer',FA:'Fall Safely',HS:'Hide in Shadows',MS:'Move Silently',TW:'Tightrope Walk'}[k]||k}</span><span>${v}%</span></div>`;});h+=`</div>`;}
  if(extras.lycan){const ly=extras.lycan;h+=`<div class="full"><div class="sec-ttl">Lycanthrope Forms</div><div class="extra-block"><p><strong>Forms:</strong> ${(ly.forms||[]).join(' / ')}</p>`;if(ly.prog){h+=`<p><strong>AC:</strong> ${ly.prog.AC} · <strong>Attacks:</strong> ${ly.prog.attacks}</p>`;if(ly.prog.special?.length)h+=`<p><strong>Abilities:</strong> ${ly.prog.special.map(k=>ly.keys?.[k]||k).join('; ')}</p>`;}h+=`</div></div>`;}
  if(extras.infernalSteed){h+=`<div><div class="sec-ttl">Infernal Steed</div><div class="eq-row"><span>${extras.infernalSteed}</span></div></div>`;}

  // Specials
  if(specials.length){h+=`<div class="full"><div class="sec-ttl">Special Abilities</div><ul class="spec-list">`;specials.slice(0,10).forEach(s=>{h+=`<li class="spec-item">${s}</li>`;});h+=`</ul></div>`;}

  // Languages
  h+=`<div class="full"><div class="sec-ttl">Languages</div><div class="lang-wrap">`;
  langs.forEach(l=>{h+=`<span class="lang-tag">${l}</span>`;});
  h+=`</div></div></div></div>`;

  document.getElementById('npc-out').innerHTML=h;
  document.getElementById('prt-npc').style.display='block';
}

// ── MASS COMBAT ───────────────────────────────────────────────────────────────
function buildMCUnit(){
  const name=document.getElementById('mc-name').value||'Unnamed Unit';
  const troops=parseInt(document.getElementById('mc-troops').value)||100;
  const hd=parseFloat(document.getElementById('mc-hd').value)||1;
  const acRaw=parseInt(document.getElementById('mc-ac').value);
  const ac=Number.isNaN(acRaw)?7:acRaw; // ?? doesn't catch NaN; ||7 would break AC 0
  const moveRate=parseInt(document.getElementById('mc-move').value)||120;
  const damage=document.getElementById('mc-dmg').value||'1d8';
  const mountType=document.getElementById('mc-mount').value;
  const cohesion=document.getElementById('mc-cohesion').value;
  const abilities=[...document.querySelectorAll('#mc-abilities input:checked')].map(i=>i.value);

  const footType=mountType!=='None'?null:(ac>=7?'Light Foot':ac>=3?'Medium Foot':'Heavy Foot');
  const quality=hd<1?{l:'Poor',p:-1}:hd<2?{l:'Average',p:0}:hd<3?{l:'Superior',p:1}:{l:'Elite',p:2};
  const mountPoA={None:0,'Light Small':0,'Light Medium':0,'Light Large':2,'Heavy Small':1,'Heavy Medium':1,'Heavy Large':3}[mountType]||0;
  const footPoA=mountType!=='None'?mountPoA:({'Light Foot':0,'Medium Foot':1,'Heavy Foot':2}[footType]||0);
  const staticPoA=quality.p+footPoA;
  let category;
  if(mountType!=='None')category=mountType.startsWith('Light')?'Skirmisher':'Impact';
  else if(footType==='Light Foot')category='Skirmisher';
  else if(footType==='Heavy Foot'||abilities.includes('Pikemen')||abilities.includes('Offensive Spearmen'))category='Impact';
  else category='Non-Skirmisher';

  const cpoa=[];
  if(abilities.includes('Defensive Spearmen'))cpoa.push('Def. Spear vs. Skirmishers/Mob: +4','Def. Spear vs. Light Foot: +3','Def. Spear vs. Medium Foot: +2','Def. Spear vs. Heavy Foot: +1','Def. Spear vs. Light Large: +3','Def. Spear vs. Heavy Large: +2');
  if(abilities.includes('Swordsmen'))cpoa.push('Swordsmen vs. Pikemen/Off. Spear: +2');
  if(abilities.includes('Offensive Spearmen')||abilities.includes('Pikemen')){const tag=abilities.includes('Pikemen')?'Pikemen':'Off. Spear';cpoa.push(`${tag} vs. Skirmishers/Mob: +5`,`${tag} vs. Light Foot: +4`,`${tag} vs. Medium Foot: +3`,`${tag} vs. Heavy Foot: +2`,`${tag} vs. Large: +1`);}
  if(abilities.includes('Longbows'))cpoa.push('Longbow vs. Skirmishers/Mob: +4','Longbow vs. Light Foot: +3','Longbow vs. Medium Foot: +2','Longbow vs. Heavy Foot: +1');
  if(abilities.includes('Crossbows'))cpoa.push('Crossbow vs. Skirmishers/Mob: +4','Crossbow vs. Light Foot: +3','Crossbow vs. Medium Foot: +2','Crossbow vs. Heavy Foot: +1');
  if(abilities.includes('Ranged Weapon'))cpoa.push('Ranged vs. Skirmishers/Mob: +2','Ranged vs. Light Foot: +1');
  if(mountType==='Light Large')cpoa.push('Light Large vs. Skirmishers/Mob: +3','Light Large vs. Light Foot: +2');
  if(mountType==='Heavy Large')cpoa.push('Heavy Large vs. Skirmishers/Mob: +5','Heavy Large vs. Light Foot: +4','Heavy Large vs. Medium Foot: +3','Heavy Large vs. Light Large: +1');
  if(category==='Impact'){cpoa.push('Impact Charge (2+ spaces): +4 PoA');if(abilities.includes('Lancers'))cpoa.push('Impact Charge w/ Lances: +8 PoA');}

  const poaStr=staticPoA>=0?'+'+staticPoA:''+staticPoA;
  const displayFoot=mountType!=='None'?`Mounted (${mountType})`:footType;

  let h=`<div class="mc-card"><div class="mc-hdr"><div class="mc-hf"><span class="mc-hl">Unit</span><span class="mc-hv">${name}</span></div><div class="mc-hf"><span class="mc-hl">Cohesion</span><span class="mc-hv">${cohesion}</span></div><div class="mc-hf"><span class="mc-hl">Total Troops</span><span class="mc-hv">${troops}</span></div><div class="mc-hf"><span class="mc-hl">HD · Total HD</span><span class="mc-hv">${hd} · ${hd*troops}</span></div></div>`;
  h+=`<div class="mc-body"><div><div class="mc-row"><span>Damage</span><span class="mc-rv">${damage}</span></div><div class="mc-row"><span>Foot Type</span><span class="mc-rv">${displayFoot}</span></div><div class="mc-row"><span>Category</span><span class="mc-rv">${category}</span></div><div class="mc-row"><span>Quality</span><span class="mc-rv">${quality.l}</span></div><div class="mc-row"><span>Movement</span><span class="mc-rv">${Math.floor(moveRate/10)}</span></div></div>`;
  h+=`<div class="poa-section"><div><div class="poa-big">${poaStr}</div><div class="poa-lbl">Static PoA</div><div class="poa-sub">Quality ${quality.p>=0?'+'+quality.p:quality.p} · Foot +${footPoA}</div></div><div><div class="sec-ttl" style="margin-bottom:6px">Circumstantial PoA</div><div class="cpoa-list">`;
  if(!cpoa.length)h+=`<div style="color:var(--ink-light);font-style:italic">None</div>`;
  else cpoa.forEach(p=>{h+=`<div class="cpoa-item">${p}</div>`;});
  h+=`</div></div></div>`;
  if(abilities.length){h+=`<div class="ab-tags"><strong style="font-family:'Cinzel',serif;font-size:9px;letter-spacing:2px;text-transform:uppercase;color:var(--crimson);margin-right:6px">Abilities</strong>`;abilities.forEach(a=>{h+=`<span class="ab-tag">${a}</span>`;});h+=`</div>`;}
  h+=`</div></div>`;

  document.getElementById('mc-out').innerHTML=h;
  document.getElementById('prt-mc').style.display='block';
}

  const byCategory = {};
  weapons.forEach(w => {
    const cat = w.category || 'NA';
    if(!byCategory[cat]) byCategory[cat] = [];
    byCategory[cat].push(w);
  });

  Object.entries(byCategory).sort(([a],[b])=>a.localeCompare(b)).forEach(([cat, weps]) => {
    h += `<div style="font-family:'Cinzel',serif;font-size:10px;letter-spacing:2px;color:var(--gold);text-transform:uppercase;margin:16px 0 6px">${cat}</div>`;
    h += `<table style="${tblStyle}"><thead><tr>
      <th style="${thStyle}">Name</th>
      <th style="${thStyle}">Cost</th>
      <th style="${thStyle}">Damage</th>
      <th style="${thStyle}">Qualities</th>
      <th style="${thStyle}">Nations</th>
      <th style="${thStyle}">Notes</th>
    </tr></thead><tbody>`;
    weps.forEach((w,i) => {
      const td = i%2===0?tdStyle:tdAltStyle;
      const quals = (w.qualities||[]).join(', ');
      const nations = (w.nations||[]).slice(0,3).join(', ')+(w.nations?.length>3?' …':'');
      h += `<tr>
        <td style="${td};font-weight:500">${w.name}</td>
        <td style="${td}">${w.cost}</td>
        <td style="${td}">${w.damage}</td>
        <td style="${td};color:var(--parchment-deep)">${quals}</td>
        <td style="${td};font-size:11px;color:var(--parchment-deep)">${nations}</td>
        <td style="${td};font-size:11px;font-style:italic;color:#b89060">${w.note||''}</td>
      </tr>`;
    });
    h += `</tbody></table>`;
  });

  // Quality descriptions
  const qdesc = GD.customWeapons?.qualityDescriptions || {};
  if(Object.keys(qdesc).length) {
    h += `<div style="font-family:'Cinzel',serif;font-size:14px;color:var(--gold-l);border-bottom:2px solid var(--gold);padding-bottom:6px;margin:28px 0 12px">Weapon Quality Glossary</div>`;
    h += `<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:8px;margin-bottom:28px">`;
    Object.entries(qdesc).forEach(([q,desc]) => {
      h += `<div style="background:rgba(245,230,200,0.04);border:1px solid var(--panel-border);border-radius:3px;padding:8px 12px">
        <div style="font-family:'Cinzel',serif;font-size:10px;letter-spacing:1.5px;color:var(--crimson);text-transform:uppercase;margin-bottom:3px">${q}</div>
        <div style="font-size:12px;color:var(--parchment);line-height:1.5">${desc}</div>
      </div>`;
    });
    h += `</div>`;
  }

  // Armour table
  h += `<div style="font-family:'Cinzel',serif;font-size:14px;color:var(--gold-l);border-bottom:2px solid var(--gold);padding-bottom:6px;margin-bottom:16px">Armour</div>`;

  const armorByCategory = {};
  armor.forEach(a => {
    const cat = a.category || 'Other';
    if(!armorByCategory[cat]) armorByCategory[cat] = [];
    armorByCategory[cat].push(a);
  });

  const catOrder = ['Leather','Chainmail','Plate mail','ANY'];
  catOrder.forEach(cat => {
    const items = armorByCategory[cat];
    if(!items) return;
    const acDesc = {Leather:'AC 6–8',Chainmail:'AC 5–6','Plate mail':'AC 2–4',ANY:'Special'}[cat]||'';
    h += `<div style="font-family:'Cinzel',serif;font-size:10px;letter-spacing:2px;color:var(--gold);text-transform:uppercase;margin:12px 0 6px">${cat} ${acDesc?'('+acDesc+')':''}</div>`;
    h += `<table style="${tblStyle}"><thead><tr>
      <th style="${thStyle}">Name</th>
      <th style="${thStyle}">Cost</th>
      <th style="${thStyle}">AC</th>
      <th style="${thStyle}">Nations</th>
      <th style="${thStyle}">Notes</th>
    </tr></thead><tbody>`;
    [...items].sort((a,b)=>a.ac-b.ac).forEach((a,i) => {
      const td = i%2===0?tdStyle:tdAltStyle;
      const nations = (a.nations||[]).slice(0,4).join(', ')+(a.nations?.length>4?' …':'');
      h += `<tr>
        <td style="${td};font-weight:500">${a.name}</td>
        <td style="${td}">${a.cost}</td>
        <td style="${td};font-family:'Cinzel',serif;font-size:15px">${a.ac}</td>
        <td style="${td};font-size:11px;color:var(--parchment-deep)">${nations}</td>
        <td style="${td};font-size:11px;font-style:italic;color:#b89060">${a.note||''}</td>
      </tr>`;
    });
    h += `</tbody></table>`;
  });

  // Shields
  h += `<div style="font-family:'Cinzel',serif;font-size:14px;color:var(--gold-l);border-bottom:2px solid var(--gold);padding-bottom:6px;margin-bottom:16px">Shields</div>`;
  h += `<table style="${tblStyle}"><thead><tr>
    <th style="${thStyle}">Name</th>
    <th style="${thStyle}">Cost</th>
    <th style="${thStyle}">AC Bonus</th>
    <th style="${thStyle}">Nations</th>
    <th style="${thStyle}">Notes</th>
  </tr></thead><tbody>`;
  [...shields].sort((a,b)=>a.acBonus-b.acBonus).forEach((s,i) => {
    const td = i%2===0?tdStyle:tdAltStyle;
    const nations = (s.nations||[]).slice(0,4).join(', ')+(s.nations?.length>4?' …':'');
    h += `<tr>
      <td style="${td};font-weight:500">${s.name}</td>
      <td style="${td}">${s.cost||'—'}</td>
      <td style="${td};font-family:'Cinzel',serif;font-size:15px">+${s.acBonus}</td>
      <td style="${td};font-size:11px;color:var(--parchment-deep)">${nations}</td>
      <td style="${td};font-size:11px;font-style:italic;color:#b89060">${s.note||''}</td>
    </tr>`;
  });
  h += `</tbody></table></div>`;

  document.getElementById('equip-content').innerHTML = h;
}

function renderReference(){
  const hd=s=>`<div style="font-family:'Cinzel Decorative',serif;color:var(--gold-l);font-size:20px;margin-bottom:18px;letter-spacing:1px">${s}</div>`;
  const sh=s=>`<div style="font-family:'Cinzel',serif;font-size:14px;color:var(--gold-l);background:rgba(212,184,120,0.1);border-left:4px solid var(--gold);padding:7px 14px;margin-bottom:14px;border-radius:2px">${s}</div>`;
  const tS=`width:100%;border-collapse:collapse;font-size:14px;margin-bottom:28px`;
  const thS=`font-family:'Cinzel',serif;font-size:9px;letter-spacing:2px;text-transform:uppercase;color:var(--gold-l);padding:7px 12px;border-bottom:2px solid var(--gold);text-align:center;background:rgba(212,184,120,0.08)`;
  const thL=`font-family:'Cinzel',serif;font-size:9px;letter-spacing:2px;text-transform:uppercase;color:var(--gold-l);padding:7px 12px;border-bottom:2px solid var(--gold);text-align:left;background:rgba(212,184,120,0.08)`;
  const tdC=(v,alt)=>`<td style="padding:6px 12px;border-bottom:1px solid var(--panel-border);text-align:center;color:var(--parchment);${alt?'background:rgba(255,255,255,0.02)':''}">${v}</td>`;
  const tdL=(v,alt)=>`<td style="padding:6px 12px;border-bottom:1px solid var(--panel-border);text-align:left;color:var(--parchment);${alt?'background:rgba(255,255,255,0.02)':''}">${v}</td>`;
  const pos=n=>n>=0?'+'+n:''+n;
  const gc=(n)=>n>0?'color:#7ec87e':n<0?'color:#e08888':'color:var(--parchment-deep)';
  let h=`<div style="max-width:900px">`;
  h+=hd('Reference Tables');
  h+=sh('Ability Score Modifiers');
  h+=`<p style="color:var(--parchment-deep);font-size:13px;font-style:italic;margin-bottom:12px">STR: melee attack & damage · INT: bonus languages · WIS: saves vs magic · DEX: AC & missile attack · CON: HP per die · CHA: reaction rolls & retainers</p>`;
  h+=`<table style="${tS}"><thead><tr><th style="${thS}">Score</th><th style="${thS}">Modifier</th><th style="${thL}">Notes</th></tr></thead><tbody>`;
  [[3,-3,"Severely impaired"],[4,-2,"Significantly below average"],[5,-2,"Below average"],[6,-1,"Below average"],[7,-1,"Below average"],[8,-1,"Below average"],[9,0,"Average"],[10,0,"Average"],[11,0,"Average"],[12,0,"Average"],[13,1,"Above average — prime requisite threshold"],[14,1,"Above average"],[15,1,"Above average"],[16,2,"Well above average — prime requisite XP bonus"],[17,2,"Exceptional"],[18,3,"Maximum human — prime requisite XP bonus"]].forEach(([sc,mod,note],i)=>{const alt=i%2===1;h+=`<tr>${tdC(`<strong>${sc}</strong>`,alt)}${tdC(`<span style="font-family:'Cinzel',serif;font-size:16px;${gc(mod)}">${pos(mod)}</span>`,alt)}${tdL(note,alt)}</tr>`;});
  h+=`</tbody></table>`;
  h+=sh('Strength — Open Doors & Bend Bars');
  h+=`<table style="${tS}"><thead><tr><th style="${thS}">STR</th><th style="${thS}">Mod</th><th style="${thS}">Open Doors</th><th style="${thS}">Bend Bars</th></tr></thead><tbody>`;
  [[3,-3,"1-in-6","0%"],[4,-2,"1-in-6","0%"],[5,-2,"1-in-6","0%"],[6,-1,"1-in-6","0%"],[7,-1,"1-in-6","0%"],[8,-1,"1-in-6","1%"],[9,0,"2-in-6","1%"],[10,0,"2-in-6","2%"],[11,0,"2-in-6","2%"],[12,0,"2-in-6","4%"],[13,1,"2-in-6","4%"],[14,1,"2-in-6","7%"],[15,1,"3-in-6","7%"],[16,2,"3-in-6","10%"],[17,2,"4-in-6","13%"],[18,3,"5-in-6","16%"]].forEach(([sc,mod,door,bar],i)=>{const alt=i%2===1;h+=`<tr>${tdC(sc,alt)}${tdC(`<span style="${gc(mod)}">${pos(mod)}</span>`,alt)}${tdC(door,alt)}${tdC(bar,alt)}</tr>`;});
  h+=`</tbody></table>`;
  h+=sh('Dexterity — AC, Missile Attack, Initiative');
  h+=`<table style="${tS}"><thead><tr><th style="${thS}">DEX</th><th style="${thS}">AC Mod</th><th style="${thS}">Missile Atk</th><th style="${thS}">Initiative</th></tr></thead><tbody>`;
  [[3,-3,-3,-2],[4,-2,-2,-1],[5,-2,-2,-1],[6,-1,-1,0],[7,-1,-1,0],[8,-1,-1,0],[9,0,0,0],[10,0,0,0],[11,0,0,0],[12,0,0,0],[13,1,1,0],[14,1,1,0],[15,1,1,0],[16,2,2,1],[17,2,2,1],[18,3,3,2]].forEach(([sc,ac,mis,ini],i)=>{const alt=i%2===1;const acC=ac<0?'color:#7ec87e':ac>0?'color:#e08888':'color:var(--parchment-deep)';h+=`<tr>${tdC(sc,alt)}${tdC(`<span style="${acC}">${pos(ac)}</span>`,alt)}${tdC(`<span style="${gc(mis)}">${pos(mis)}</span>`,alt)}${tdC(`<span style="${gc(ini)}">${pos(ini)}</span>`,alt)}</tr>`;});
  h+=`</tbody></table><p style="color:var(--parchment-deep);font-size:12px;font-style:italic;margin-bottom:24px">AC modifier reduces AC (lower=better). Full Plate negates DEX bonus. Half Plate max +1.</p>`;
  h+=sh('Constitution — HP per Die');
  h+=`<table style="${tS}"><thead><tr><th style="${thS}">CON</th><th style="${thS}">HP/Die</th><th style="${thS}">Racial Save Bonus (Dwarf-type)</th></tr></thead><tbody>`;
  [[3,-3,"+0"],[4,-2,"+0"],[5,-2,"+0"],[6,-1,"+0"],[7,-1,"+2"],[8,-1,"+2"],[9,0,"+2"],[10,0,"+2"],[11,0,"+3"],[12,0,"+3"],[13,1,"+3"],[14,1,"+3"],[15,1,"+4"],[16,2,"+4"],[17,2,"+4"],[18,3,"+5"]].forEach(([sc,hp,sav],i)=>{const alt=i%2===1;h+=`<tr>${tdC(sc,alt)}${tdC(`<span style="${gc(hp)}">${pos(hp)}</span>`,alt)}${tdC(sav,alt)}</tr>`;});
  h+=`</tbody></table>`;
  h+=sh('Charisma — Retainers & Reaction Rolls');
  h+=`<table style="${tS}"><thead><tr><th style="${thS}">CHA</th><th style="${thS}">Mod</th><th style="${thS}">Max Retainers</th><th style="${thS}">Loyalty</th><th style="${thS}">Reaction Mod</th></tr></thead><tbody>`;
  [[3,-3,1,4,-2],[4,-2,1,5,-1],[5,-2,2,6,-1],[6,-1,2,7,-1],[7,-1,3,7,0],[8,-1,3,8,0],[9,0,4,8,0],[10,0,4,9,0],[11,0,4,9,0],[12,0,5,9,0],[13,1,5,10,1],[14,1,6,10,1],[15,1,7,10,1],[16,2,8,11,2],[17,2,9,12,2],[18,3,12,12,2]].forEach(([sc,mod,ret,loy,rea],i)=>{const alt=i%2===1;h+=`<tr>${tdC(sc,alt)}${tdC(`<span style="${gc(mod)}">${pos(mod)}</span>`,alt)}${tdC(ret,alt)}${tdC(loy,alt)}${tdC(`<span style="${gc(rea)}">${pos(rea)}</span>`,alt)}</tr>`;});
  h+=`</tbody></table>`;
  h+=sh('Multiclassing Rules (Optional)');
  h+=`<div style="background:rgba(245,230,200,0.04);border:1px solid var(--panel-border);border-radius:3px;padding:16px 20px;font-size:14px;color:var(--parchment);line-height:1.8;margin-bottom:28px">
    <p><strong style="color:var(--gold)">Choosing:</strong> Up to 3 classes at character creation. Cannot add later.</p>
    <p><strong style="color:var(--gold)">XP:</strong> Split evenly between classes. Each class levels separately.</p>
    <p><strong style="color:var(--gold)">HP:</strong> Roll HD per class separately; divide total by number of classes. Fractions tracked. Minimum 1 HP per roll.</p>
    <p><strong style="color:var(--gold)">THAC0 &amp; Saves:</strong> Use the best value from any class in each category.</p>
    <p><strong style="color:var(--gold)">Armour &amp; Weapons:</strong> Best options permitted by any class.</p>
    <p><strong style="color:var(--gold)">Spellcasting:</strong> All classes cast without restriction.</p>
    <p><strong style="color:var(--gold)">Stealth Skills:</strong> Only usable in armour permitted by the class granting that skill.</p>
  </div>`;
  h+=sh('Saving Throw Categories');
  h+=`<table style="${tS}"><thead><tr><th style="${thL}">Category</th><th style="${thL}">Covers</th></tr></thead><tbody>`;
  [["Death / Poison","Instant-death effects, poison, reduced to 0 HP by massive damage"],["Wands","Wands, rays, and similar directed magical devices"],["Paralysis / Petrification","Paralysing attacks (ghouls etc.), petrification, polymorph effects"],["Breath Weapon","Dragon breath, hydra breath, and similar area breath attacks"],["Spells / Rods / Staves","All spells not covered above, plus magical rods and staves"]].forEach(([cat,desc],i)=>{const alt=i%2===1;h+=`<tr>${tdL(`<strong>${cat}</strong>`,alt)}${tdL(desc,alt)}</tr>`;});
  h+=`</tbody></table></div>`;
  document.getElementById('ref-content').innerHTML=h;
}

</script>
